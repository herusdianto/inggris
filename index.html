<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>English Quest</title>
  <meta name="description" content="Game belajar bahasa Inggris dari TK sampai Advanced">
  <meta name="theme-color" content="#6c5ce7">
  <link rel="icon" type="image/png" href="icons/favicon-64.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="English Quest">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Pasang tema sedini mungkin agar tidak berkedip.
    try {
      const t = JSON.parse(localStorage.getItem('englishQuest.v1') || '{}').theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar" id="topbar">
    <a href="#/" class="brand"><span class="brand-logo">🦊</span><span class="brand-name">English Quest</span></a>
    <nav class="nav" id="nav">
      <a href="#/" data-nav="home"><span>🏠</span><b>Belajar</b></a>
      <a href="#/progress" data-nav="progress"><span>📈</span><b>Progres</b></a>
      <a href="#/review" data-nav="review"><span>🔁</span><b>Ulangi</b></a>
      <a href="#/settings" data-nav="settings"><span>⚙️</span><b>Atur</b></a>
    </nav>
    <div class="stats-mini">
      <span class="chip" id="chip-streak" title="Streak harian">🔥 <b>0</b></span>
      <span class="chip" id="chip-xp" title="XP hari ini / target">⚡ <b>0</b></span>
      <button class="icon-btn hidden" id="install-btn" aria-label="Pasang aplikasi" title="Pasang aplikasi">📲</button>
      <button class="icon-btn" id="theme-btn" aria-label="Ganti tema" title="Ganti tema">🌙</button>
      <a class="icon-btn" href="https://github.com/herusdianto/inggris" target="_blank" rel="noopener" aria-label="Kode sumber di GitHub" title="GitHub">
        <svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
